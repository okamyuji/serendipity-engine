# compose.prod.yml for Serendipity Engine production
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: serendipity-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-serendipity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-serendipity_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-serendipity} -d ${POSTGRES_DB:-serendipity_production}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - serendipity-network

  redis:
    image: redis:7-alpine
    container_name: serendipity-redis-prod
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - serendipity-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: serendipity-backend-prod
    command: bash -c "bundle exec rails db:migrate && bundle exec rails server -b 0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-serendipity}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-serendipity_production}
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-text-embedding-3-small}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    restart: unless-stopped
    networks:
      - serendipity-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: serendipity-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - serendipity-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  serendipity-network:
    driver: bridge
