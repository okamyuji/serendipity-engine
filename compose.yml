# compose.yml for Serendipity Engine development
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: serendipity-db
    environment:
      POSTGRES_USER: serendipity
      POSTGRES_PASSWORD: serendipity_dev
      POSTGRES_DB: serendipity_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U serendipity -d serendipity_development"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: serendipity-backend
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails db:migrate && bundle exec rails server -b 0.0.0.0"
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://serendipity:serendipity_dev@db:5432/serendipity_development
      RAILS_ENV: development
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-your-api-key-here}
      OPENAI_MODEL: text-embedding-3-small
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-for-development}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: serendipity-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3000

volumes:
  postgres_data:
  bundle_cache:
